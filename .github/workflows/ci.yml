name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_HOME: ${{ github.workspace }}/.dotnet-cli-home
  SOLUTION_FILE: DiagKit.Uds.slnx
  UDS_TEST_PROJECT: tests/DiagKit.Uds.Tests/DiagKit.Uds.Tests.csproj
  CANHUB_TEST_PROJECT: tests/DiagKit.Uds.CanHub.Tests/DiagKit.Uds.CanHub.Tests.csproj
  UDS_PACKAGE_PROJECT: src/DiagKit.Uds/DiagKit.Uds.csproj
  CANHUB_PACKAGE_PROJECT: src/DiagKit.Uds.CanHub/DiagKit.Uds.CanHub.csproj

jobs:
  restore-build-test-pack:
    name: Restore, build, test, pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        shell: pwsh
        run: dotnet restore "$env:SOLUTION_FILE"

      - name: Build
        shell: pwsh
        run: dotnet build "$env:SOLUTION_FILE" -c Release --no-restore

      - name: Test DiagKit.Uds
        shell: pwsh
        run: dotnet test "$env:UDS_TEST_PROJECT" -c Release --no-build --logger "trx;LogFileName=uds-test-results.trx" --results-directory TestResults

      - name: Test DiagKit.Uds.CanHub
        shell: pwsh
        run: dotnet test "$env:CANHUB_TEST_PROJECT" -c Release --no-build --logger "trx;LogFileName=canhub-test-results.trx" --results-directory TestResults

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          dotnet pack "$env:UDS_PACKAGE_PROJECT" -c Release --no-build -o artifacts/packages
          dotnet pack "$env:CANHUB_PACKAGE_PROJECT" -c Release --no-build -o artifacts/packages

      - name: Upload package artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
