name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_HOME: ${{ github.workspace }}/.dotnet-cli-home
  SOLUTION_FILE: DiagKit.Uds.slnx
  TEST_PROJECT: tests/DiagKit.Uds.Tests/DiagKit.Uds.Tests.csproj
  PACKAGE_PROJECT: src/DiagKit.Uds/DiagKit.Uds.csproj
  ARTIFACTS_DIR: artifacts/packages

jobs:
  build-test-pack-publish:
    name: Build, test, pack, publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Release tags must look like v1.0.0 or v1.0.0-preview.1."
            exit 1
          fi

      - name: Detect prerelease
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore "$SOLUTION_FILE"

      - name: Build
        run: dotnet build "$SOLUTION_FILE" -c Release --no-restore

      - name: Test
        run: dotnet test "$TEST_PROJECT" -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Pack
        run: dotnet pack "$PACKAGE_PROJECT" -c Release --no-build -o "$ARTIFACTS_DIR"

      - name: Push packages to NuGet
        run: dotnet nuget push "$ARTIFACTS_DIR"/*.nupkg --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push symbols to NuGet
        run: dotnet nuget push "$ARTIFACTS_DIR"/*.snupkg --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          generate_release_notes: true
          prerelease: ${{ steps.release.outputs.prerelease }}
